        params.set('value', String(data2));
        sendMidi(params);
      } else if (command === 0xe0) {
        const raw = (data2 << 7) | data1;
        const semitones = ((raw - 8192) / 8192) * 2;
        params.set('event', 'bend');
        params.set('semitones', semitones.toFixed(4));
        sendMidi(params);
      }
    }

    function attachMidiInputs(access) {
      const inputs = [...access.inputs.values()];
      const savedId = storedSetting('midiInput', 'all');
      const savedName = storedSetting('midiInputName');
      midiInput.replaceChildren();
      for (const [value, label] of [['all', 'All MIDI devices'], ['none', 'None']]) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        midiInput.append(option);
      }
      for (const input of inputs) {
        const option = document.createElement('option');
        option.value = input.id;
        option.textContent = input.name || input.manufacturer || 'MIDI input';
        midiInput.append(option);
      }
      const savedOption = [...midiInput.options].find((option) => option.value === savedId)
        || [...midiInput.options].find((option) => option.textContent === savedName);
      midiInput.value = savedOption ? savedOption.value : 'all';

      let count = 0;
      for (const input of inputs) {
        const enabled = midiInput.value === 'all' || midiInput.value === input.id;
        input.onmidimessage = enabled ? handleMidiMessage : null;
        if (enabled) count += 1;
      }
      midiInputValue.textContent = midiInput.value === 'none'
        ? 'off'
        : count > 0 ? `${count} active` : 'none';
      updateMidiStatus(count > 0, count > 0 || midiInput.value === 'none' ? '' : 'no-inputs');
    }

    midiInput.addEventListener('change', () => {
      storeSetting('midiInput', midiInput.value);
      if (midiInput.selectedOptions[0]) storeSetting('midiInputName', midiInput.selectedOptions[0].textContent);
      if (midiAccess) attachMidiInputs(midiAccess);
    });

    async function initBrowserMidi() {
      if (!navigator.requestMIDIAccess) {
        updateMidiStatus(false, 'web-midi-unavailable');
        return;
      }
      try {
        midiAccess = await navigator.requestMIDIAccess({ sysex: false });
        attachMidiInputs(midiAccess);
        midiAccess.onstatechange = () => attachMidiInputs(midiAccess);
      } catch (error) {
        midiInputValue.textContent = 'denied';
        updateMidiStatus(false, 'web-midi-denied');
      }
    }

    function connectEvents() {
      const source = new EventSource('/events');
      source.addEventListener('open', () => {
        linkChip.textContent = 'live';
        linkChip.classList.add('good');
      });
      source.addEventListener('error', () => {
        linkChip.textContent = pendingBackend ? 'switching' : 'reconnecting';
        linkChip.classList.remove('good');
      });
      source.addEventListener('state', (event) => {
        applyState(JSON.parse(event.data));
      });
    }

    bindDragNumber(timeSpanInput, {
      min: MIN_TIME_SPAN,
      max: MAX_TIME_SPAN,
      step: 0.5,
      pixelsPerStep: 6,
      value: () => view.seconds,
      onChange: setTimeSpan,
    });
    bindDragNumber(pitchSpanInput, {
      min: MIN_PITCH_SPAN,
      max: MAX_PITCH_SPAN,
      step: 1,
      pixelsPerStep: 4,
      value: () => view.semitones,
      onChange: setPitchSpan,
    });
    function syncPillThumb(groupEl, activeButton) {
      if (!groupEl || !activeButton) return;
      const thumb = groupEl.querySelector('.pill-thumb');
      if (!thumb) return;
      const inset = 4;
      const left = activeButton.offsetLeft - inset;
      const top = activeButton.offsetTop - inset;
      const thumbRadius = activeButton.offsetHeight / 2;
      thumb.style.width = `${activeButton.offsetWidth}px`;
      thumb.style.height = `${activeButton.offsetHeight}px`;
      thumb.style.borderRadius = `${thumbRadius}px`;
      thumb.style.transform = `translate(${left}px, ${top}px)`;
      groupEl.style.borderRadius = `${thumbRadius + inset}px`;
    }

    function animatePillGroup(groupEl, updateFn) {
      groupEl.classList.add('is-animating');
      updateFn();
      window.setTimeout(() => groupEl.classList.remove('is-animating'), 220);
    }

    function setOrientation(orientation, persist = true, animate = true) {
      const update = () => {
        view.orientation = orientation === 'vertical' ? 'vertical' : 'horizontal';
        const vertical = view.orientation === 'vertical';
        horizontalFlow.classList.toggle('is-active', !vertical);
        verticalFlow.classList.toggle('is-active', vertical);
        horizontalFlow.setAttribute('aria-selected', String(!vertical));
        verticalFlow.setAttribute('aria-selected', String(vertical));
        syncPillThumb(orientationGroup, vertical ? verticalFlow : horizontalFlow);
      };
      if (animate) animatePillGroup(orientationGroup, update);
      else update();
      if (persist) storeSetting('orientation', view.orientation);
      canvas.title = view.orientation === 'horizontal'
        ? 'Drag the right piano vertically to change the visible pitch range.'
        : 'Drag the bottom piano horizontally to change the visible pitch range.';
      canvas.style.cursor = 'default';
    }
    function setUnvoicedMode(mode, persist = true, animate = true) {
      const update = () => {
        unvoicedMode = mode === 'hold-ratio' ? 'hold-ratio' : 'tc-bypass';
        const hold = unvoicedMode === 'hold-ratio';
        tcBypassMode.classList.toggle('is-active', !hold);
        holdRatioMode.classList.toggle('is-active', hold);
        tcBypassMode.setAttribute('aria-selected', String(!hold));
        holdRatioMode.setAttribute('aria-selected', String(hold));
        syncPillThumb(unvoicedGroup, hold ? holdRatioMode : tcBypassMode);
      };
      if (animate) animatePillGroup(unvoicedGroup, update);
      else update();
      if (persist) {
        savedUnvoicedMode = unvoicedMode;
        storeSetting('unvoicedMode', unvoicedMode);
      }
    }
    function setFreezeMode(mode, persist = true, animate = true) {
      const update = () => {
        freezeMode = mode === 'momentary' ? 'momentary' : 'latch';
        const momentary = freezeMode === 'momentary';
        freezeLatchMode.classList.toggle('is-active', !momentary);
        freezeMomentaryMode.classList.toggle('is-active', momentary);
        freezeLatchMode.setAttribute('aria-selected', String(!momentary));
        freezeMomentaryMode.setAttribute('aria-selected', String(momentary));
        syncPillThumb(freezeModeGroup, momentary ? freezeMomentaryMode : freezeLatchMode);
      };
      if (animate) animatePillGroup(freezeModeGroup, update);
      else update();
      if (persist) storeSetting('freezeMode', freezeMode);
    }
    async function sendFreeze(slot, action) {
      const params = new URLSearchParams({ slot: String(slot), action });
      const response = await fetch(`/api/freeze?${params.toString()}`);
      if (response.ok) applyState(await response.json());
    }
    freezeTriggers.forEach((button, slot) => {
      let pointerHeld = false;
      let keyboardHeld = false;
      button.addEventListener('click', (event) => {
        if (freezeMode !== 'latch') {
          event.preventDefault();
          return;
        }
        sendFreeze(slot, 'toggle').catch(() => {});
      });
      button.addEventListener('pointerdown', (event) => {
        if (freezeMode !== 'momentary' || event.button !== 0) return;
        event.preventDefault();
        pointerHeld = true;
        button.setPointerCapture(event.pointerId);
        sendFreeze(slot, 'on').catch(() => {});
      });
      const releasePointerFreeze = (event) => {
        if (!pointerHeld) return;
        pointerHeld = false;
        if (button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId);
        sendFreeze(slot, 'off').catch(() => {});
      };
      button.addEventListener('pointerup', releasePointerFreeze);
      button.addEventListener('pointercancel', releasePointerFreeze);
      button.addEventListener('keydown', (event) => {
        if (freezeMode !== 'momentary' || keyboardHeld ||
            !['Enter', ' '].includes(event.key)) return;
        event.preventDefault();
        keyboardHeld = true;
        sendFreeze(slot, 'on').catch(() => {});
      });
      button.addEventListener('keyup', (event) => {
        if (!keyboardHeld || !['Enter', ' '].includes(event.key)) return;
        event.preventDefault();
        keyboardHeld = false;
        sendFreeze(slot, 'off').catch(() => {});
      });
      button.addEventListener('blur', () => {
        if (!keyboardHeld) return;
        keyboardHeld = false;
        sendFreeze(slot, 'off').catch(() => {});
      });
    });
    clearFreezes.addEventListener('click', () => {
      for (let slot = 0; slot < freezeTriggers.length; slot += 1) {
        sendFreeze(slot, 'clear').catch(() => {});
      }
    });
    horizontalFlow.addEventListener('click', () => setOrientation('horizontal'));
    verticalFlow.addEventListener('click', () => setOrientation('vertical'));
    tcBypassMode.addEventListener('click', () => {
      setUnvoicedMode('tc-bypass');
      pushControls().catch(() => {});
    });
    holdRatioMode.addEventListener('click', () => {
      setUnvoicedMode('hold-ratio');
      pushControls().catch(() => {});
    });
    freezeLatchMode.addEventListener('click', () => setFreezeMode('latch'));
    freezeMomentaryMode.addEventListener('click', () => setFreezeMode('momentary'));
    setOrientation(view.orientation, false, false);
    setUnvoicedMode(unvoicedMode, false, false);
    setFreezeMode(freezeMode, false, false);
    syncViewInputs();
    window.addEventListener('resize', () => {
      fitCanvas();
      syncPillThumb(orientationGroup, view.orientation === 'vertical' ? verticalFlow : horizontalFlow);
      syncPillThumb(unvoicedGroup, unvoicedMode === 'hold-ratio' ? holdRatioMode : tcBypassMode);
      syncPillThumb(freezeModeGroup, freezeMode === 'momentary' ? freezeMomentaryMode : freezeLatchMode);
    });

    async function initializeApp() {
      try {
        const response = await fetch('/api/state');
        applyState(await response.json());
      } catch {
        linkChip.textContent = 'reconnecting';
      }
      restoreSavedControlValues();
      controlsInitialized = true;
      await pushControls().catch(() => {});
      const backendInfo = await loadBackends().catch(() => null);
      connectEvents();
      initBrowserMidi();
      const savedBackend = storedSetting('backend', backendInfo ? backendInfo.selected : '');
      const savedBackendOption = [...backend.options].find(
        (option) => option.value === savedBackend && !option.disabled
      );
      if (savedBackendOption && savedBackend !== (state && state.backendKey)) {
        backend.value = savedBackend;
        await switchBackend(savedBackend, false);
        return;
      }
      await loadAudioInputs().catch(() => { audioInputValue.textContent = 'error'; });
      await loadAudioOutputs().catch(() => { audioOutputValue.textContent = 'error'; });
    }

    initializeApp();
    draw();
  </script>
</body>
</html>
